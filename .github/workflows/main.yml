      #   run: |
      #     git config --global user.name 'github-actions[bot]'
      #     git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      #     git add cache/*.mod.xml.gz output/*.xml output/*.xml.gz
      #     git commit -m 'Automated EPG update and Pluto ID change' || echo "No changes to commit"
      #     git push
